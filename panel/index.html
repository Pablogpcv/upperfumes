<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Granja de videos · Upperfumes</title>
<link rel="icon" href="../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>

/* Layout idea: tiles de resumen arriba, tablero por etapas a la izquierda, agentes y actividad a la derecha, detalle en cajón lateral. */
:root{
  --bg:#0A0A0A; --panel:#141311; --panel-2:#1D1B17; --line:#2e2a20;
  --text:#F5F5DC; --muted:#A39E8A; --gold:#D4AF37; --gold-ink:#0A0A0A;
  --ok:#62d394; --bad:#f0705f; --info:#58c7dd;
  --r:12px;
  --display:Cinzel,'Trajan Pro',Georgia,serif;
  --body:Jost,'Helvetica Neue',Arial,sans-serif;
  --mono:Jost,'Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--body)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1560px;margin:0 auto;padding:20px 20px 64px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
h1{font:600 28px/1.1 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--gold)}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.top-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.demo{font:500 11px var(--mono);letter-spacing:.04em;color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:6px 10px}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:#4a4338}
.btn.pri{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.bad{border-color:#5a2f2a;color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}

.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:6px}
.tile:hover{border-color:#4a4338}
.tile[aria-pressed="true"]{border-color:var(--gold);background:var(--panel-2)}
.tile .n{font:600 32px/1 var(--display);font-variant-numeric:tabular-nums}
.tile .l{font-size:13px;color:var(--muted)}
.tile.t-review .n{color:var(--gold)} .tile.t-work .n{color:var(--info)} .tile.t-bad .n{color:var(--bad)} .tile.t-ok .n{color:var(--ok)}

.layout{display:flex;flex-direction:column;gap:16px}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x proximity}
.col{flex:0 0 268px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:10px;min-height:320px;scroll-snap-align:start}
.col-h{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px}
.col-h b{font:600 14px var(--display)}
.col-h .cnt{font:500 12px var(--mono);color:var(--muted)}
.col-agent{font-size:12px;color:var(--muted);padding:0 4px;margin-top:-6px}
.empty{color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:10px;padding:14px;text-align:center}

.card{background:var(--panel-2);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:11px 12px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.card:hover{border-color:#4a4338}
.card.s-review{border-left-color:var(--gold)} .card.s-working{border-left-color:var(--info)} .card.s-rejected{border-left-color:var(--bad)} .card.s-done{border-left-color:var(--ok)}
.card .code{font:500 11px var(--mono);color:var(--muted);letter-spacing:.05em}
.card h3{margin:0;font:600 15px/1.25 var(--display);text-wrap:balance}
.card .hook{margin:0;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;border:1px solid var(--line);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.pill.review{color:var(--gold);border-color:#5b4a1d} .pill.working{color:var(--info);border-color:#1f4d57}
.pill.rejected{color:var(--bad);border-color:#5a2f2a} .pill.done{color:var(--ok);border-color:#235239}
.pill.working i{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pill.working i{animation:none}}
.bar{height:6px;background:#2a2621;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--info);width:0}
.pct{font:500 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.acts{display:flex;gap:8px}
.acts .btn{flex:1}
.reason{font-size:13px;color:var(--bad);margin:0}

.side{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.box h2{margin:0 0 10px;font:600 15px var(--display)}
.agent{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.agent:first-of-type{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:0 0 10px;background:#4a4640}
.dot.working{background:var(--info)} .dot.review{background:var(--gold)}
.agent b{font-size:14px;display:block}
.agent span{font-size:13px;color:var(--muted)}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.feed li{font-size:13px;display:grid;grid-template-columns:84px 1fr;gap:8px}
.feed time{font:500 11px var(--mono);color:var(--muted);padding-top:2px}
.feed em{font-style:normal;color:var(--gold)}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:21;display:flex;flex-direction:column}
.d-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.d-head h2{margin:4px 0 8px;font:600 21px/1.2 var(--display);text-wrap:balance}
.d-body{overflow:auto;padding:18px;flex:1;display:flex;flex-direction:column;gap:18px}
.d-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
.d-foot .btn{flex:1;min-width:130px}
.sec h4{margin:0 0 6px;font:500 11px var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.sec p{margin:0}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.scenes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.scenes li{display:grid;grid-template-columns:26px 1fr;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px}
.scenes .no{font:500 12px var(--mono);color:var(--gold);padding-top:2px}
.scenes small{display:block;color:var(--muted);font-size:12px}
.sb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fr{aspect-ratio:9/16;border-radius:8px;border:1px solid var(--line);background:radial-gradient(ellipse at 50% 0,#3a2d12 0,#0b0a08 70%);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:8px;gap:8px}
.fr b{font:600 13px/1.15 var(--display);color:var(--gold);text-wrap:balance}
.fr span{font:700 10px/1.2 var(--body);color:var(--text);margin-top:auto}
video{width:100%;max-height:58vh;border-radius:10px;background:#000;display:block}
.cap{white-space:pre-wrap;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font:500 12px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.note{font-size:13px;color:var(--muted)}

.modal{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.65)}
.mbox{width:min(460px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.mbox h2{margin:0;font:600 20px var(--display)}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
input[type=text],textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px 12px;font:inherit;width:100%}
textarea{min-height:92px;resize:vertical}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:#1a1712;border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;z-index:40;max-width:calc(100% - 32px)}

@media (max-width:860px){.side{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:16px 16px 56px}h1{font-size:24px}.sb{grid-template-columns:repeat(2,minmax(0,1fr))}}

.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lbox{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px}
.lbox h1{font-size:22px}
.err{color:var(--bad);font-size:13px;margin:0;min-height:18px}
.user{font-size:13px;color:var(--muted)}
.intro{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 16px;text-align:center}
.intro p{margin:0;color:var(--muted);max-width:46ch}
.btn.sm.demo-b{border-style:dashed;color:var(--muted)}

</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
/* Panel de aprobación de la granja de videos.
   Datos: tabla admin_datos de Supabase, una fila por video con clave "videos|<id>".
   Solo administradores (la política es_admin() ya protege esa tabla). */
const SB_URL="https://pyxmrttbjynccwviotef.supabase.co", SB_KEY="sb_publishable_QDeX1szmmx4wxQ4enVhuyQ_SdKFxxGM";
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const STAGES=[
  {id:'idea',name:'Ideas',agent:'Agente de ideas',what:'la idea',did:'propuso la idea'},
  {id:'guion',name:'Guion',agent:'Agente de guion',what:'el guion',did:'entregó el guion'},
  {id:'render',name:'Animación',agent:'Agente de animación',what:'el render',did:'entregó el render'},
  {id:'edicion',name:'Edición',agent:'Agente de edición',what:'el video final',did:'entregó el video final'},
  {id:'publicado',name:'Listos para publicar',agent:null,what:'',did:''}
];
const sOf=id=>STAGES.find(s=>s.id===id);
const DEFAULT_TAGS=['#perfumes','#upperfumes','#fragancias','#colombia'];

let user=null, cards=[], ui={open:null,filter:'all',reject:null,newIdea:false,loginErr:'',booting:true};
try{const s=JSON.parse(sessionStorage.getItem('gv-ui')||'{}');ui.open=s.open||null;ui.filter=s.filter||'all';}catch(e){}
function saveUi(){try{sessionStorage.setItem('gv-ui',JSON.stringify({open:ui.open,filter:ui.filter}))}catch(e){}}

const live=()=>cards.filter(c=>c.status!=='archived');
const get=id=>cards.find(c=>c.id===id);
function log(c,who,text){c.history=c.history||[];c.history.push({t:Date.now(),who,text})}
function rel(t){
  const m=Math.round((Date.now()-t)/60000);
  if(m<1)return 'ahora';
  if(m<60)return 'hace '+m+' min';
  const h=Math.round(m/60);
  if(h<24)return 'hace '+h+' h';
  return new Date(t).toLocaleDateString('es-CO',{day:'numeric',month:'short'});
}
const pillText={review:'Por aprobar',working:'En cola',rejected:'Rechazada',done:'Lista'};
const pill=s=>'<span class="pill '+s+'"><i></i>'+pillText[s]+'</span>';
function guionOf(c){
  if(c.guion&&c.guion.length)return c.guion;
  return [[c.title.toUpperCase(),c.hook],['DESARROLLO','Ejemplo: el agente de guion escribe aquí'],['DESARROLLO','Ejemplo: el agente de guion escribe aquí'],['¿Y TÚ?','COMENTA']];
}
function captionOf(c){
  if(c.caption)return c.caption;
  return c.hook+'. '+(c.idea&&c.idea.cta?c.idea.cta+'. ':'')+'Asesoría personalizada: escríbenos o entra al link en mi perfil.';
}

/* ---------- vistas ---------- */
function cardHtml(c){
  const st=sOf(c.stage);let mid='',acts='';
  if(c.status==='working'){
    mid='<p class="pct">'+esc(st.agent)+' · en cola '+rel(c.startedAt||Date.now())+'</p>'+(c.error?'<p class="reason">'+esc(c.error)+'</p>':'');
  }else if(c.status==='review'){
    acts='<div class="acts"><button class="btn pri sm" data-a="approve" data-id="'+c.id+'">Aprobar</button><button class="btn sm" data-a="reject" data-id="'+c.id+'">Rechazar</button></div>';
  }else if(c.status==='rejected'){
    mid='<p class="reason">'+esc(c.rejectReason||'Sin motivo')+'</p>';
    acts='<div class="acts"><button class="btn pri sm" data-a="redo" data-id="'+c.id+'">Rehacer</button><button class="btn sm" data-a="archive" data-id="'+c.id+'">Archivar</button></div>';
  }
  return '<article class="card s-'+c.status+'" tabindex="0" role="button" data-a="open" data-id="'+c.id+'" aria-label="Abrir '+esc(c.title)+'">'
    +'<div class="row"><span class="code">'+esc(c.code)+(c.mine?' · TUYA':'')+'</span>'+pill(c.status)+'</div>'
    +'<h3>'+esc(c.title)+'</h3><p class="hook">'+esc(c.hook)+'</p>'+mid+acts+'</article>';
}
function matches(c){
  if(ui.filter==='all')return true;
  if(ui.filter==='review')return c.status==='review';
  if(ui.filter==='working')return c.status==='working';
  if(ui.filter==='rejected')return c.status==='rejected';
  if(ui.filter==='done')return c.stage==='publicado';
  return true;
}
function boardHtml(){
  return STAGES.map(st=>{
    const cs=live().filter(c=>c.stage===st.id&&matches(c));
    const body=cs.length?cs.map(cardHtml).join(''):'<div class="empty">'+(st.id==='publicado'?'Aún no hay videos aprobados.':'Nada aquí con este filtro.')+'</div>';
    return '<section class="col" aria-label="'+st.name+'"><div class="col-h"><b>'+st.name+'</b><span class="cnt">'+cs.length+'</span></div>'
      +'<div class="col-agent">'+(st.agent?esc(st.agent):'Tú decides cuándo subirlos')+'</div>'+body+'</section>';
  }).join('');
}
function tilesHtml(){
  const L=live();const n=f=>L.filter(f).length;
  const T=[
    ['review','Esperan tu aprobación',n(c=>c.status==='review'),'t-review'],
    ['working','En cola para agentes',n(c=>c.status==='working'),'t-work'],
    ['rejected','Rechazadas',n(c=>c.status==='rejected'),'t-bad'],
    ['done','Listos para publicar',n(c=>c.stage==='publicado'),'t-ok']
  ];
  return T.map(t=>'<button class="tile '+t[3]+'" data-a="filter" data-f="'+t[0]+'" aria-pressed="'+(ui.filter===t[0])+'"><span class="n">'+t[2]+'</span><span class="l">'+t[1]+'</span></button>').join('');
}
function agentsHtml(){
  return STAGES.filter(s=>s.agent).map(st=>{
    const cs=live().filter(c=>c.stage===st.id);
    const w=cs.filter(c=>c.status==='working'),r=cs.filter(c=>c.status==='review');
    let cls='',txt='Libre, sin tareas';
    if(w.length){cls='working';txt='Tarea en cola: «'+esc(w[0].title)+'»';}
    else if(r.length){cls='review';txt='Esperando tu aprobación · '+r.length+(r.length>1?' tareas':' tarea');}
    return '<div class="agent"><span class="dot '+cls+'"></span><div><b>'+st.agent+'</b><span>'+txt+'</span></div></div>';
  }).join('');
}
function feedHtml(){
  const items=[];
  live().forEach(c=>(c.history||[]).forEach(h=>items.push({t:h.t,who:h.who,text:h.text,c})));
  items.sort((a,b)=>b.t-a.t);
  const out=items.slice(0,8).map(i=>'<li><time>'+rel(i.t)+'</time><span><em>'+esc(i.who)+'</em> '+esc(i.text)+' · '+esc(i.c.code)+'</span></li>').join('');
  return out||'<li><span class="note">Aún no hay actividad.</span></li>';
}
function drawerHtml(c){
  const st=sOf(c.stage),idea=c.idea||{};let body='';
  body+='<div class="sec"><h4>La idea</h4><dl class="kv"><dt>Gancho</dt><dd>'+esc(c.hook)+'</dd><dt>Ángulo</dt><dd>'+esc(idea.angulo||'')+'</dd><dt>Cierre</dt><dd>'+esc(idea.cta||'Sin definir')+'</dd><dt>Duración</dt><dd>'+esc(idea.duracion||'~30 s')+'</dd></dl></div>';
  if(c.status==='working')body+='<div class="sec"><h4>'+esc(st.agent)+'</h4><p class="note">En cola. El agente revisa el panel cada 5 minutos y deja el resultado aquí para que lo apruebes.'+(c.error?' Último error: '+esc(c.error):'')+'</p></div>';
  if(c.videoUrl&&c.status!=='working')body+='<div class="sec"><h4>Video</h4><video controls playsinline preload="metadata" src="'+esc(c.videoUrl)+'"></video></div>';
  if(c.stage!=='idea'&&!(c.stage==='guion'&&c.status==='working')){
    const g=guionOf(c);
    if(c.stage==='guion')body+='<div class="sec"><h4>Guion propuesto</h4><ol class="scenes">'+g.map((s,i)=>'<li><span class="no">'+(i+1)+'</span><div><b>'+esc(s[0])+'</b><small>'+esc(s[1])+'</small></div></li>').join('')+'</ol></div>';
    else body+='<div class="sec"><h4>Escenas</h4><div class="sb">'+g.map(s=>'<div class="fr"><b>'+esc(s[0])+'</b><span>'+esc(s[1])+'</span></div>').join('')+'</div></div>';
  }
  if((c.stage==='edicion'||c.stage==='publicado')&&c.status!=='working'){
    body+='<div class="sec"><h4>Texto para publicar</h4><div class="cap">'+esc(captionOf(c))+'</div><div class="tags" style="margin-top:8px">'+(c.tags||DEFAULT_TAGS).map(t=>'<span>'+esc(t)+'</span>').join('')+'</div><p class="note" style="margin-top:8px">Música: '+esc(c.music||'por elegir.')+'</p></div>';
  }
  if(c.status==='rejected')body+='<div class="sec"><h4>Por qué la rechazaste</h4><p class="reason">'+esc(c.rejectReason||'')+'</p></div>';
  body+='<div class="sec"><h4>Historial</h4><ul class="feed">'+(c.history||[]).slice().reverse().map(h=>'<li><time>'+rel(h.t)+'</time><span><em>'+esc(h.who)+'</em> '+esc(h.text)+'</span></li>').join('')+'</ul></div>';
  let foot='';
  if(c.status==='review')foot='<button class="btn pri" data-a="approve" data-id="'+c.id+'">'+(c.stage==='edicion'?'Aprobar y dejar listo':'Aprobar '+st.what)+'</button><button class="btn bad" data-a="reject" data-id="'+c.id+'">Rechazar</button>';
  else if(c.status==='rejected')foot='<button class="btn pri" data-a="redo" data-id="'+c.id+'">Pedir otra versión</button><button class="btn" data-a="archive" data-id="'+c.id+'">Archivar</button>';
  else if(c.stage==='publicado')foot='<button class="btn pri" data-a="copy" data-id="'+c.id+'">Copiar texto para publicar</button>';
  return '<div class="scrim" data-a="close"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Detalle del video">'
    +'<div class="d-head"><div><span class="code" style="font:500 11px var(--mono);color:var(--muted);letter-spacing:.06em">'+esc(c.code)+' · '+esc(st.name.toUpperCase())+'</span><h2>'+esc(c.title)+'</h2>'+pill(c.status)+'</div><button class="btn sm" data-a="close" id="close-btn">Cerrar</button></div>'
    +'<div class="d-body">'+body+'</div>'+(foot?'<div class="d-foot">'+foot+'</div>':'')+'</aside>';
}
function modalHtml(){
  if(ui.reject){const c=get(ui.reject);
    return '<div class="modal"><div class="mbox" role="dialog" aria-modal="true" aria-label="Rechazar"><h2>Rechazar «'+esc(c.title)+'»</h2><label for="rej-text">¿Qué debe cambiar el agente?<textarea id="rej-text" placeholder="Ejemplo: el gancho es débil, empieza con una pregunta."></textarea></label><div class="row" style="justify-content:flex-end"><button class="btn" data-a="modal-close">Cancelar</button><button class="btn bad" data-a="reject-confirm">Rechazar</button></div></div></div>';}
  if(ui.newIdea)
    return '<div class="modal"><div class="mbox" role="dialog" aria-modal="true" aria-label="Nueva idea"><h2>Nueva idea</h2><label for="ni-title">Tema del video<input type="text" id="ni-title" placeholder="Ejemplo: Perfumes para regalar en diciembre"></label><label for="ni-hook">Gancho o primera frase<input type="text" id="ni-hook" placeholder="Ejemplo: Regalas perfume y no sabes cuál elegir"></label><div class="row" style="justify-content:flex-end"><button class="btn" data-a="modal-close">Cancelar</button><button class="btn pri" data-a="newidea-save">Añadir a Ideas</button></div></div></div>';
  return '';
}
function loginHtml(){
  return '<div class="login"><form class="lbox" id="lf"><h1>Granja de videos <span>Upperfumes</span></h1><p class="sub" style="margin:0">Entra con tu cuenta de administrador de la tienda.</p>'
    +'<label for="lg-mail">Correo<input type="email" id="lg-mail" autocomplete="username" required style="background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px 12px;font:inherit;width:100%"></label>'
    +'<label for="lg-pass">Contraseña<input type="password" id="lg-pass" autocomplete="current-password" required style="background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px 12px;font:inherit;width:100%"></label>'
    +'<p class="err" role="alert">'+esc(ui.loginErr)+'</p><button class="btn pri" type="submit">Entrar</button><a class="note" href="../">Volver a la tienda</a></form></div>';
}
function render(){
  if(ui.booting){$('#root').innerHTML='<div class="login"><p class="note">Cargando…</p></div>';return;}
  if(!user){$('#root').innerHTML=loginHtml();return;}
  const board=document.querySelector('.board');const sl=board?board.scrollLeft:0;
  const dbody=document.querySelector('.d-body');const sc=dbody?dbody.scrollTop:0;
  const open=ui.open?get(ui.open):null;
  const empty=!live().length;
  $('#root').innerHTML='<div class="wrap">'
    +'<header class="top"><div><h1>Granja de videos <span>Upperfumes</span></h1><div class="sub">Tú apruebas cada etapa. Los agentes hacen el resto.</div></div>'
    +'<div class="top-r"><span class="demo">AGENTES REVISAN CADA 5 MIN</span><span class="user">'+esc(user.email)+'</span><button class="btn sm" data-a="logout">Salir</button><button class="btn pri" data-a="newidea">+ Nueva idea</button></div></header>'
    +(empty?'<div class="intro"><h2 style="margin:0;font:600 20px var(--display)">Aún no hay videos</h2><p>Añade una idea tuya o carga las de ejemplo para probar el flujo de aprobación.</p><div class="row"><button class="btn pri" data-a="newidea">+ Nueva idea</button><button class="btn" data-a="seed">Cargar ejemplos</button></div></div>'
      :'<div class="tiles">'+tilesHtml()+'</div><div class="layout"><div class="board">'+boardHtml()+'</div><aside class="side"><div class="box"><h2>Agentes</h2>'+agentsHtml()+'</div><div class="box"><h2>Actividad</h2><ul class="feed">'+feedHtml()+'</ul></div></aside></div>')
    +'</div>'+(open?drawerHtml(open):'')+modalHtml();
  const nb=document.querySelector('.board');if(nb)nb.scrollLeft=sl;
  const nd=document.querySelector('.d-body');if(nd&&open)nd.scrollTop=sc;
  if(ui.reject){const t=$('#rej-text');if(t)t.focus();}else if(ui.newIdea){const t=$('#ni-title');if(t)t.focus();}
}
function toast(m){
  const old=$('.toast');if(old)old.remove();
  const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);
  setTimeout(()=>t.remove(),3200);
}

/* ---------- datos (Supabase) ---------- */
async function load(){
  const {data,error}=await sb.from('admin_datos').select('clave,data').like('clave','videos|%');
  if(error){toast('No se pudo cargar. Revisa tu conexión.');return false;}
  cards=(data||[]).map(r=>r.data).filter(Boolean);
  return true;
}
async function persist(c){
  c.u=Date.now();
  render();
  const {error}=await sb.from('admin_datos').upsert({clave:'videos|'+c.id,data:c,actualizado:new Date().toISOString()});
  if(error){toast('No se pudo guardar. Intenta de nuevo.');await load();render();}
}
async function boot(){
  try{
    const {data}=await sb.auth.getSession();
    if(data.session)await enter(data.session.user);
  }catch(e){}
  ui.booting=false;render();
}
async function enter(u){
  const {data:pf}=await sb.from('perfiles').select('email,rol').eq('id',u.id).single();
  if(!pf||pf.rol!=='admin'){await sb.auth.signOut();user=null;ui.loginErr='Esta cuenta no es de administrador.';return;}
  user={id:u.id,email:pf.email||u.email};
  await load();
}
document.addEventListener('submit',async ev=>{
  if(ev.target.id!=='lf')return;
  ev.preventDefault();
  const email=$('#lg-mail').value.trim(),pass=$('#lg-pass').value;
  ui.loginErr='';
  const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){ui.loginErr='Correo o contraseña incorrectos.';render();return;}
  await enter(data.user);render();
});

/* ---------- acciones ---------- */
function approve(id){
  const c=get(id);if(!c||c.status!=='review')return;
  const i=STAGES.findIndex(s=>s.id===c.stage),cur=STAGES[i],nx=STAGES[i+1];
  log(c,'Tú','aprobaste '+cur.what);
  c.stage=nx.id;c.rejectReason=null;
  if(nx.id==='publicado'){c.status='done';c.startedAt=null;}else{c.status='working';c.startedAt=Date.now();}
  persist(c);
}
function rejectConfirm(){
  const c=get(ui.reject);const r=($('#rej-text').value||'').trim();
  if(!r){toast('Escribe qué debe cambiar el agente.');return;}
  c.status='rejected';c.rejectReason=r;log(c,'Tú','rechazaste '+sOf(c.stage).what+': «'+r+'»');
  ui.reject=null;persist(c);
}
function redo(id){const c=get(id);log(c,'Tú','pediste otra versión');c.status='working';c.startedAt=Date.now();c.version=(c.version||1)+1;persist(c);}
function archive(id){const c=get(id);log(c,'Tú','archivaste el video');c.status='archived';if(ui.open===id){ui.open=null;saveUi();}persist(c);}
function nextCode(){const n=Math.max(0,...cards.map(c=>parseInt(String(c.code).replace(/\D/g,''),10)||0))+1;return 'EXP '+String(n).padStart(2,'0');}
function newId(){return 'v'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function newIdeaSave(){
  const t=($('#ni-title').value||'').trim(),h=($('#ni-hook').value||'').trim();
  if(t.length<3){toast('Escribe el tema del video.');return;}
  const c={id:newId(),code:nextCode(),title:t,hook:h||t,stage:'idea',status:'review',mine:true,
    idea:{angulo:'Idea creada por ti',cta:'',duracion:'~30 s'},history:[{t:Date.now(),who:'Tú',text:'creaste la idea'}]};
  cards.push(c);ui.newIdea=false;persist(c);
}
async function seed(){
  const now=Date.now(),AI='Agente de ideas';
  const mk=(n,title,hook,angulo,cta,guion)=>({id:newId(),code:'EXP 0'+n,title,hook,stage:'idea',status:'review',idea:{angulo,cta,duracion:'~30 s'},guion,history:[{t:now,who:AI,text:'propuso la idea'}]});
  const list=[
    {id:newId(),code:'EXP 01',title:'Las 3 notas del perfume',hook:'El perfume que hueles al rociarlo no es el que te queda',stage:'edicion',status:'review',videoUrl:'videos/expediente01.mp4',
     idea:{angulo:'Pirámide olfativa: notas de salida, corazón y fondo con duración aproximada',cta:'¿Qué notas buscas tú? Asesoría personalizada',duracion:'32 s'},
     guion:[['EL PERFUME QUE HUELES AL ROCIARLO','NO ES EL QUE TE QUEDA'],['EXPEDIENTE 01','TRES CAPAS'],['NOTAS DE SALIDA','LO PRIMERO QUE HUELES'],['NOTAS DE CORAZÓN','ES EL CARÁCTER'],['NOTAS DE FONDO','LA BASE DURA HORAS'],['NO LO JUZGUES EN EL PRIMER SPRAY','ESPERA 15 MINUTOS'],['¿QUÉ NOTAS BUSCAS TÚ?','TE AYUDAMOS A ELEGIR']],
     caption:'El perfume que hueles al rociarlo no es el que te queda. Salida, corazón y fondo: así cambia con el tiempo. ¿Qué notas buscas tú? Escríbenos y te asesoramos.',
     tags:['#perfumes','#upperfumes','#notasolfativas','#colombia'],music:'falta agregarla. El video sale sin audio.',
     history:[{t:now,who:'Agente de edición',text:'entregó el video final'}]},
    mk(2,'Cómo hacer que tu perfume dure más','Rocías mal y no te dura','Cuatro hábitos simples: piel hidratada, puntos de pulso, no frotar y guardarlo lejos del calor','Guarda el video y pruébalo hoy',[['ROCÍAS MAL','Y NO TE DURA'],['HÁBITO 1','HIDRATA LA PIEL ANTES'],['HÁBITO 2','ROCÍA EN PUNTOS DE PULSO'],['HÁBITO 3','NO FROTES LAS MUÑECAS'],['HÁBITO 4','GUÁRDALO LEJOS DEL CALOR'],['¿CUÁL FALLABAS?','COMENTA']]),
    mk(3,'Perfumes para clima caliente','El calor cambia cómo huele tu perfume','Por qué los cítricos, acuáticos y verdes rinden mejor con calor y qué conviene evitar','Comenta de qué ciudad me ves',[['EL CALOR','CAMBIA TU PERFUME'],['CON CALOR','TODO SE PROYECTA MÁS'],['MEJOR','CÍTRICOS Y ACUÁTICOS'],['TAMBIÉN','VERDES Y AROMÁTICOS'],['CUIDADO','CON LOS MUY DULCES'],['¿DE QUÉ CIUDAD','ME VES?']]),
    mk(4,'Cómo probar un perfume sin equivocarte','Lo compras por el primer olor y te arrepientes','Probar en la piel, esperar 15 minutos y no pasar de 3 pruebas','Guarda el video para tu próxima compra',[['LO OLISTE EN TIRA','Y TE ARREPENTISTE'],['PASO 1','PRUÉBALO EN LA PIEL'],['PASO 2','ESPERA 15 MINUTOS'],['PASO 3','MÁXIMO 3 PRUEBAS'],['PASO 4','DESCANSA LA NARIZ'],['ASESORÍA','TE AYUDAMOS A ELEGIR']]),
    mk(5,'Perfume para la oficina o para salir','No todos los perfumes sirven para todo','Elegir según el lugar: pocos sprays en espacios cerrados, más intensidad de noche','Comenta para qué lo necesitas',[['UN SOLO PERFUME','NO SIRVE PARA TODO'],['OFICINA','SUAVE Y LIMPIO'],['DE DÍA','FRESCO Y LIGERO'],['DE NOCHE','MÁS INTENSO Y DULCE'],['REGLA','ESPACIO CERRADO, POCOS SPRAYS'],['¿PARA QUÉ','LO NECESITAS?']])
  ];
  const rows=list.map(c=>({clave:'videos|'+c.id,data:c,actualizado:new Date().toISOString()}));
  const {error}=await sb.from('admin_datos').upsert(rows);
  if(error){toast('No se pudieron cargar los ejemplos.');return;}
  cards=cards.concat(list);render();
}

document.addEventListener('click',async ev=>{
  const t=ev.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a,id=t.dataset.id;
  if(a==='open'){ui.open=id;saveUi();render();const b=$('#close-btn');if(b)b.focus();}
  else if(a==='close'){ui.open=null;saveUi();render();}
  else if(a==='filter'){ui.filter=ui.filter===t.dataset.f?'all':t.dataset.f;saveUi();render();}
  else if(a==='approve')approve(id);
  else if(a==='reject'){ui.reject=id;render();}
  else if(a==='reject-confirm')rejectConfirm();
  else if(a==='redo')redo(id);
  else if(a==='archive')archive(id);
  else if(a==='newidea'){ui.newIdea=true;render();}
  else if(a==='newidea-save')newIdeaSave();
  else if(a==='seed')seed();
  else if(a==='modal-close'){ui.reject=null;ui.newIdea=false;render();}
  else if(a==='logout'){await sb.auth.signOut();user=null;cards=[];ui.open=null;render();}
  else if(a==='copy'){
    const c=get(id);const txt=captionOf(c)+'\n\n'+(c.tags||DEFAULT_TAGS).join(' ');
    try{navigator.clipboard.writeText(txt).then(()=>toast('Texto copiado')).catch(()=>toast('No se pudo copiar'));}catch(e){toast('No se pudo copiar');}
  }
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){
    if(ui.reject||ui.newIdea){ui.reject=null;ui.newIdea=false;render();}
    else if(ui.open){ui.open=null;saveUi();render();}
  }
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.classList&&ev.target.classList.contains('card')){ev.preventDefault();ev.target.click();}
});
/* refresco cada 20 s para ver lo que cambie el otro administrador o un agente */
setInterval(async()=>{if(!user||ui.reject||ui.newIdea||document.hidden)return;if(await load())render();},20000);
boot();
</script>
